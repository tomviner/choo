[project]
name = "choo"
description = "UK train times from your terminal"
version = "0.1.2"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tom Viner", email = "traintimes@viner.tv" },
]
dependencies = [
  "purl>=1.1",
  "requests>=2.31",
  "python-dotenv>=1",
  "pydantic>=2.7",
  "typer>=0.9",
  "rich>=13",
  "rapidfuzz>=3",
  "platformdirs>=4",
  "httpx>=0.28.1",
]

[project.scripts]
choo = "choo.app:app"

[project.urls]
Homepage = "https://github.com/tomviner/choo"

[dependency-groups]
test = [
  "freezegun",
  "pytest",
  "pytest-cov",
  "requests-mock",
]

[build-system]
requires = ["uv_build>=0.6,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["choo", "traintimes"]

[tool.ruff]
target-version = "py310"
force-exclude = true
exclude = [".venv"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle Error
  "W",  # pycodestyle Warning
  "F",  # Pyflakes
  "I",  # isort
  "C90",  # mccabe (code complexity)
  "T10",  # flake8-debugger
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.coverage.run]
branch = true
source = ["traintimes", "choo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 100

[tool.pytest.ini_options]
addopts = "--cov"
